# Nginx configuration for api.niharadaura.com with Socket.io WebSocket support
# 
# USAGE: Copy this file to your EC2 server:
#   sudo cp nginx-socketio.conf /etc/nginx/sites-available/api.niharadaura.com
#   sudo ln -sf /etc/nginx/sites-available/api.niharadaura.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This configuration is REQUIRED for Socket.io real-time updates to work.

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting for Socket.io
limit_req_zone $binary_remote_addr zone=socketio:10m rate=30r/s;

server {
    listen 80;
    server_name api.niharadaura.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.niharadaura.com;

    # SSL certificates (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/api.niharadaura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.niharadaura.com/privkey.pem;

    # Socket.io WebSocket endpoint - CRITICAL for real-time updates
    location /socket.io/ {
        limit_req zone=socketio burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers - REQUIRED
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for real-time data
        proxy_buffering off;
        proxy_cache off;
    }

    # Regular API endpoints
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable gzip compression for API responses
        gzip on;
        gzip_types application/json text/plain;
        gzip_min_length 256;
    }
}
